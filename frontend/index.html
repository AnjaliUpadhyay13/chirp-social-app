<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Chirp - a modern social media app" />
    <meta name="theme-color" content="#080c12" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f97316'/%3E%3Cpath d='M9 10.5A2.5 2.5 0 0 1 11.5 8h9a2.5 2.5 0 0 1 2.5 2.5v6a2.5 2.5 0 0 1-2.5 2.5H15l-4 3.5V19h-.5A1.5 1.5 0 0 1 9 17.5z' fill='white'/%3E%3C/svg%3E" />
    <title>Chirp</title>
    <script>
      // Apply the saved theme (default: dark) before first paint to avoid a flash
      (function () {
        try {
          var t = localStorage.getItem('chirp-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark'; // dark is the default look
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
